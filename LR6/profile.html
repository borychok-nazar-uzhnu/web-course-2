<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профіль користувача</title>
    <link rel="stylesheet" href="styles.css"> <!-- Підключення CSS файлу -->
</head>
<body>
    <header>
        <h1>Профіль користувача</h1>
    </header>

    <section class="profile-card">
        <div class="profile-photo">
            <!-- Вставка вашого зображення через URL -->
            <img src="https://st4.depositphotos.com/4678277/28917/i/450/depositphotos_289173464-stock-photo-close-up-photo-amazing-he.jpg" alt="Фото користувача">
        </div>
        <h2>Боричок Назар</h2>
        <p class="bio">Це опис користувача. Тут можна написати кілька слів про його діяльність, інтереси та інше.</p>
    </section>

    <section class="grades-table">
        <h3>Оцінки</h3>
        <table>
            <thead>
                <tr>
                    <th>Предмет</th>
                    <th>Оцінка</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Математика</td>
                    <td>8</td>
                </tr>
                <tr>
                    <td>Інформатика</td>
                    <td>9</td>
                </tr>
                <tr>
                    <td>Фізика</td>
                    <td>7</td>
                </tr>
            </tbody>
        </table>
    </section>
</body>
</html>
